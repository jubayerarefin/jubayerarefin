name: Update GitHub Stats

on:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    name: Update GitHub Stats
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=jubayerarefin&theme=radical&hide=ratings,icons&hide_border=true&title_color=f8967c&text_color=e6e9e8&bg_color=0d1117&icon_color=f8967c&line_height=27&cache_seconds=86400"
          path: public/stats-card.svg
          token: ${{ secrets.ACTION_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=jubayerarefin&theme=radical&layout=compact&hide_border=true&title_color=f8967c&text_color=e6e9e8&bg_color=0d1117&langs_count=8&cache_seconds=86400"
          path: public/top-langs.svg
          token: ${{ secrets.ACTION_TOKEN }}

      - name: Generate trophy
        uses: ryo-ma/github-profile-trophy@v1.0
        with:
          username: jubayerarefin
          output_path: public/trophy.svg
          token: ${{ secrets.ACTION_TOKEN }}
          theme: radical

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin master
          git add public/*.svg
          git diff --staged --quiet || git commit -m "chore: update GitHub stats [skip ci]"
          git push origin master
