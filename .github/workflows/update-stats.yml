name: Update GitHub Stats

on:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    name: Update GitHub Stats
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        run: |
          mkdir -p public
          npx -y github-readme-stats \
            --username jubayerarefin \
            --theme radical \
            --hide "ratings,icons" \
            --hide_border \
            --title_color f8967c \
            --text_color e6e9e8 \
            --bg_color 0d1117 \
            --icon_color f8967c \
            --line_height 27 \
            --cache_seconds 86400 \
            > public/stats-card.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        run: |
          mkdir -p public
          npx -y github-readme-stats \
            --type topLanguages \
            --username jubayerarefin \
            --theme radical \
            --layout compact \
            --hide_border \
            --title_color f8967c \
            --text_color e6e9e8 \
            --bg_color 0d1117 \
            --langs_count 8 \
            --cache_seconds 86400 \
            > public/top-langs.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophy
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: jubayerarefin
          output_file: public/trophy.svg
          theme: radical
          row: 1
          cache_seconds: 86400

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git fetch origin master
          git add public/*.svg
          git diff --staged --quiet || git commit -m "chore: update GitHub stats [skip ci]"
          git push origin master
